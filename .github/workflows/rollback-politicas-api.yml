name: Rollback Politicas API

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID'
        required: true
        type: string

jobs:
  restaurar:
    name: Restaurar Políticas desde Backup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      # Al no poner 'name', descarga TODOS los artefactos de ese run_id
      - name: Descargar Backups de la ejecución anterior
        uses: actions/download-artifact@v4
        with:
          path: backups/
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login en Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ejecutar Script de Restauración Masiva
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RG: 'rgpacificoprod'
          AZURE_APIM_NAME: 'ApiMgmt-pacificoProd'
        run: |
          cat << 'EOF' > run_rollback_masivo.py
          import os, sys, glob, subprocess, requests

          sub_id = os.environ["AZURE_SUBSCRIPTION_ID"]
          rg = os.environ["AZURE_RG"]
          apim = os.environ["AZURE_APIM_NAME"]

          token = subprocess.check_output(["az", "account", "get-access-token", "--query", "accessToken", "-o", "tsv"]).decode("utf-8").strip()
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "If-Match": "*"
          }

          # Buscamos XML de forma recursiva (porque GitHub crea subcarpetas por cada artefacto)
          archivos_xml = glob.glob("backups/**/*.xml", recursive=True)
          
          if not archivos_xml:
              print("❌ No se encontraron archivos XML en los artefactos descargados de este Run ID.")
              sys.exit(1)

          hubo_errores = False
          print(f"--- Iniciando RESTAURACIÓN GENÉRICA (Archivos encontrados: {len(archivos_xml)}) ---")

          for archivo in archivos_xml:
              api_id = os.path.basename(archivo).replace(".xml", "")
              print(f"⏩ Procesando: {api_id}")
              
              with open(archivo, "r", encoding="utf-8") as f:
                  xml_content = f.read()
                  
              url = f"https://management.azure.com/subscriptions/{sub_id}/resourceGroups/{rg}/providers/Microsoft.ApiManagement/service/{apim}/apis/{api_id}/policies/policy?api-version=2022-08-01"
              payload = {"properties": {"format": "xml", "value": xml_content}}
              
              res = requests.put(url, headers=headers, json=payload)
              if res.status_code in [200, 201]:
                  print(f"  ✅ Restaurada correctamente.")
              else:
                  print(f"  ❌ Error HTTP {res.status_code} - {res.text}")
                  hubo_errores = True

          if hubo_errores:
              sys.exit(1)
          EOF
          python run_rollback_masivo.py
